# .github/workflows/sql-radar-pr.yml
name: Slow Query Radar PR Scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  sql-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      # Findings are informational for now; failing mode will be enabled after the team agrees.
      - name: Scan repository
        run: dotnet run --project src/SlowQueryRadar.Cli --configuration Release --no-build -- scan-repo --path ./src --output-json pr-report.json
      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: sql-radar-pr-report
          path: pr-report.json
